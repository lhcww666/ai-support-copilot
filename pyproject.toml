[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-copilot"
version = "0.1.0"
description = "FastAPI and LangChain enterprise support copilot with RAG, tools and evaluations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "httpx==0.28.1",
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-openai==1.7.2",
  "langchain-text-splitters==1.1.3",
  "numpy==2.5.4",
  "pgvector==0.5.1",
  "pypdf==6.21.2",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "data/seed/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
